databaseChangeLog:
  - changeSet:
      id: 10
      author: Kate Kraska
      changes:
        - createTable:
            tableName: payment_statuses
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true