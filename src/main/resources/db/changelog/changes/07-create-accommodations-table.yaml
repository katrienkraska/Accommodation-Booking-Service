databaseChangeLog:
  - changeSet:
      id: 7
      author: Kate Kraska
      changes:
        - createTable:
            tableName: accommodations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: type_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: address_id
                  type: BIGINT
              - column:
                  name: size_type
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: daily_rate
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: availability
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: is_deleted
                  type: BIT(1)
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_accommodations_type
            baseTableName: accommodations
            baseColumnNames: type_id
            referencedTableName: accommodation_types
            referencedColumnNames: id

        - addForeignKeyConstraint:
            constraintName: fk_accommodations_address
            baseTableName: accommodations
            baseColumnNames: address_id
            referencedTableName: addresses
            referencedColumnNames: id